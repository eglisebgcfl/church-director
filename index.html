<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ministry Connect</title>
<style>
:root{--bg:#f5f6fa;--ink:#1c2233;--mut:#5b6479;--pri:#2e3a8c;--onpri:#fff;--acc:#e41f26;--card:#fff;--ln:#dde1ea;--ok:#2e7d4f;--wa:#b7791f;--no:#b23a3a;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#12141f;--ink:#e8eaf3;--mut:#a3a9bf;--pri:#8f9cf0;--onpri:#10132a;--acc:#ff6b70;--card:#1b1e2e;--ln:#2f3350;--ok:#5cc08a;--wa:#e0a84f;--no:#e07a7a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0}
header{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;padding:.5rem 1rem;background:#fff;color:#2e3a8c;border-bottom:4px solid var(--acc)}
header h1{font-size:1rem;line-height:1.2;max-width:15rem}
.brand{display:flex;align-items:center;gap:.6rem}
.lg{height:3.4rem;width:auto}
.lgl{display:block;margin:0 auto;width:22rem;max-width:100%;height:auto;background:#fff;border-radius:8px;padding:.5rem}
.prt{display:none}
.tools{display:flex;gap:.35rem}
.tools button{background:transparent;color:inherit;border:1px solid currentColor;border-radius:6px;padding:.3rem .6rem;font:inherit;cursor:pointer}
.login .tools{justify-content:flex-end;color:var(--pri)}
nav{display:flex;gap:.25rem;padding:0 1rem;border-bottom:1px solid var(--ln);background:var(--card);overflow-x:auto}
nav button{background:none;border:0;padding:.8rem 1rem;font:inherit;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--acc);font-weight:600}
main{max-width:46rem;margin:0 auto;padding:1rem}
.login{max-width:24rem;margin-top:12vh}
.login h1{font-size:1.15rem;margin:.75rem 0 1rem;text-align:center}
label{display:block;margin:.5rem 0;flex:1}
input,select,textarea{font:inherit;padding:.55rem .7rem;border:1px solid var(--ln);border-radius:6px;background:var(--card);color:var(--ink);width:100%}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0}
.row>*{flex:1;min-width:9rem}
.btn{background:var(--pri);color:var(--onpri);border:0;padding:.65rem 1.1rem;border-radius:6px;font:inherit;cursor:pointer;list-style:none}
.btn.alt{background:none;color:var(--pri);border:1px solid var(--pri)}
summary::-webkit-details-marker{display:none}
.pr{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.6rem 0;border-bottom:1px solid var(--ln)}
.st{display:flex;gap:.35rem}
.st button{width:2.6rem;height:2.6rem;border-radius:6px;border:1px solid var(--ln);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.st .P.on{background:var(--ok);border-color:var(--ok);color:#fff}
.st .R.on{background:var(--wa);border-color:var(--wa);color:#fff}
.st .A.on{background:var(--no);border-color:var(--no);color:#fff}
.fam{padding:.8rem 0;border-bottom:1px solid var(--ln)}
.fam h2{font-size:1.1rem;margin-bottom:.25rem}
.fam p{margin:.35rem 0}
fieldset{border:1px solid var(--ln);border-radius:6px;margin:.75rem 0}
.chk{display:inline-flex;align-items:center;gap:.4rem;margin:.25rem .75rem .25rem 0}
.chk input{width:auto}
.mut,.leg{color:var(--mut)}
.leg{font-size:.9rem;margin:.25rem 0 .5rem}
.msg{color:var(--mut);min-height:1.4em}
.sp{margin:1.5rem 0 .5rem;font-size:1.1rem}
details form{padding:.75rem 0}
.sec{border:1px solid var(--ln);border-radius:6px;margin:.5rem 0;background:var(--card)}
.sec>summary{padding:.7rem .9rem;cursor:pointer;font-weight:600}
.sec>summary::after{content:"+";float:right}
.sec[open]>summary::after{content:"−"}
.sec>div{padding:0 .9rem .9rem}
.ph{width:4.5rem;height:4.5rem;border-radius:6px;object-fit:cover;background:var(--ln);display:inline-flex;align-items:center;justify-content:center;font-weight:600;color:var(--mut);flex:none}
.mb{display:flex;gap:.75rem;align-items:flex-start}
.mb p{margin:0}
.mem{display:flex;flex-wrap:wrap;gap:1rem}
.ind{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.75rem}
.card{border:1px solid var(--ln);border-radius:6px;padding:.6rem;background:var(--card)}
.sm{padding:.35rem .7rem;font-size:.9rem;cursor:pointer;white-space:nowrap}
.fam,.card{break-inside:avoid}
.lf{padding:.5rem 0 1rem;border-bottom:1px solid var(--ln)}
.acts{display:flex;gap:.35rem}
.pcard{margin:.75rem 0}
.home{max-width:30rem;margin:0 auto;padding:1rem 1rem 2rem;min-height:100vh;display:flex;flex-direction:column}
.home .tools{justify-content:flex-end;color:var(--pri)}
.hero{text-align:center;margin:1rem 0 1.25rem;padding:1.4rem 1rem 1.2rem;background:var(--card);border-radius:16px;border-top:5px solid var(--acc);box-shadow:0 4px 18px rgba(46,58,140,.14)}
.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:1.35rem;line-height:1.25;color:var(--pri);margin:1rem 0 .3rem}
.tag{color:var(--mut);margin:0}
.big{display:flex;align-items:center;gap:.9rem;width:100%;text-align:left;padding:1rem 1.1rem;border-radius:12px;border:2px solid var(--pri);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;margin:.6rem 0;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.big.pri{background:var(--pri);color:var(--onpri)}
.big svg{width:2.1rem;height:2.1rem;flex:none}
.big strong{display:block;font-size:1.05rem}
.big small{display:block;opacity:.85}
.srch{width:100%;margin:.5rem 0}
.s4 div{min-width:4.5rem}
.foot{margin-top:auto;text-align:center;color:var(--mut);font-size:.85rem;padding-top:1.5rem}
.mc{min-height:100vh;position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#0e1858 0%,#1d2a82 48%,#3745c2 100%)}
.mc::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 64%,rgba(255,255,255,.07) 64% 67%,transparent 67% 73%,rgba(255,255,255,.4) 73% 75%,rgba(6,12,76,.6) 75% 83%,rgba(96,116,255,.4) 83% 91%,transparent 91%)}
.mc::after{content:"";position:absolute;right:5%;bottom:10%;width:7.5rem;height:4.5rem;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.9) 3px,transparent 4px);background-size:1.5rem 1.5rem}
.mch{position:relative;z-index:1;max-width:64rem;margin:0 auto;padding:1rem 1rem 2rem;display:flex;flex-direction:column;min-height:100vh}
.mch .tools{justify-content:flex-end;color:#fff}
.mc-grid{display:grid;gap:1rem 2rem;grid-template-areas:"top" "text" "acts";margin-top:.5rem}
.mc-top{grid-area:top}.mc-badge{grid-area:badge}.mc-text{grid-area:text}.mc-acts{grid-area:acts;max-width:30rem;margin-bottom:2rem}
.mc-kick{font-size:1.05rem;font-weight:600;margin:.5rem 0 0}
.mc-logo{display:block;width:min(26rem,100%);height:auto}
.mc-text h2{font-size:1.5rem;margin:0 0 .5rem}
.mc-desc{opacity:.92;line-height:1.6;max-width:38rem;margin:0}
.mc-church{background:#fff;border-radius:16px;padding:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:22rem;margin:0 auto}
.mc-church img{display:block;width:100%;height:auto}
.mc .big{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.6);color:#fff}
.mc .big.pri{background:#e41f26;border-color:#e41f26}
.mc-credit{margin:auto -1rem 0;padding:.9rem 1.2rem;background:#4350cf;clip-path:polygon(0 0,94% 0,90% 100%,0 100%)}
.mc-credit small{display:block;opacity:.9}
.mc-credit strong{font-size:1.15rem}
.mcx{min-height:100vh;background:linear-gradient(135deg,#14206b,#2f3ca8);color:#fff}
.mcx-in{max-width:78rem;margin:0 auto;padding:.75rem 1rem 2rem}
.mcx .tools{justify-content:flex-end;color:#fff;margin-bottom:.5rem}
.mcx-img{display:block;width:auto;height:auto;max-width:100%;max-height:40vh;margin:0 auto}
.mcx .mc-acts{margin:1rem auto 0;max-width:60rem;display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr))}
.mcx .big{margin:0}
.gnav.dark{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:0 .4rem;margin:.25rem 0 .9rem}
.gnav.dark button{color:#dfe4ff}
.gnav.dark button.on{color:#fff;border-color:#e41f26}
.mc-nav{position:relative;z-index:1;max-width:72rem;margin:0 auto;padding:.75rem 1rem 0}
.mcx .big{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.6);color:#fff}
.mcx .big.pri{background:#e41f26;border-color:#e41f26}
.mc .login{background:var(--card);color:var(--ink);border-radius:16px;padding:1.2rem;margin-top:6vh;position:relative;z-index:1}
@media(max-width:700px){.mc::after{display:none}}
.pills{display:flex;gap:.4rem;flex-wrap:wrap;max-width:46rem;margin:0 auto;padding:.75rem 1rem 0}
.pills:empty{display:none}
.tabs{display:flex;gap:.25rem;overflow-x:auto;border-bottom:1px solid var(--ln);margin:.5rem 0}
.tb{background:none;border:0;border-bottom:3px solid transparent;padding:.55rem .75rem;font:inherit;color:var(--mut);cursor:pointer;white-space:nowrap}
.tb.on{color:var(--ink);border-color:var(--acc);font-weight:600}
.pane.off{display:none}
a{color:var(--pri)}
table{width:100%;border-collapse:collapse}
th,td{padding:.45rem .5rem;border-bottom:1px solid var(--ln);text-align:left}
th{font-weight:600;color:var(--mut)}
.n{text-align:right}
.low{color:var(--no);font-weight:600}
.wrap{overflow-x:auto}
.sum{display:flex;gap:.75rem;flex-wrap:wrap;margin:.75rem 0}
.sum div{flex:1;min-width:8rem;border:1px solid var(--ln);border-radius:6px;padding:.6rem;background:var(--card)}
.sum b{display:block;font-size:1.5rem;font-family:Georgia,"Times New Roman",serif}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media print{header,nav,#subnav,.noprint{display:none!important}body{background:#fff;color:#000}.prt{display:block!important;text-align:center;margin-bottom:1rem}.prt img{height:5rem}}
</style>

const tr=x=>{const e=TR[x];return lang==='fr'||!e?x:e[lang==='en'?0:1]};
function tx(root){if(lang==='fr')return;const i=lang==='en'?0:1;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{const k=n.nodeValue.trim(),e=TR[k];if(e)n.nodeValue=n.nodeValue.replace(k,e[i])});
  root.querySelectorAll('[placeholder],[aria-label]').forEach(el=>['placeholder','aria-label'].forEach(a=>{const e=TR[el.getAttribute(a)];if(e)el.setAttribute(a,e[i])}))}

let HOMEV=false,NEXT=null;
function gnav(active,dark){
  const staff=prof&&prof.role!=='admin'?['min','att','cal','rep']:['mem','min','att','cal','rep'];
  const items=[['home','home'],['new','newvis'],['reg','reg']].concat(staff.map(k=>[k,k]));
  return `<nav class="gnav${dark?' dark':''}">${items.map(([k,l])=>`<button class="${active===k?'on':''}" onclick="navTo('${k}')">${t(l)}</button>`).join('')}</nav>`;
}
function navTo(k){
  history.replaceState(null,'',location.pathname);
  if(k==='home'){PUB=false;if(prof){HOMEV=true;homeView()}else loginView('','home');return}
  if(k==='new'){HOMEV=false;pubGo();return}
  if(k==='reg'){HOMEV=false;regGo();return}
  PUB=false;
  if(!prof){NEXT=k;loginView(t('needlogin'),'login');return}
  HOMEV=false;tab=k;shell();
}
function render(){document.documentElement.lang=lang;document.documentElement.style.fontSize=fs+'px';if(PUB){pubView();return}if(HOMEV&&prof){homeView();return}prof?shell():loginView()}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return render();
  const {data}=await sb.from('profiles').select('role,full_name').eq('id',session.user.id).maybeSingle();
  if(!data){await sb.auth.signOut();prof=null;return loginView(t('nop'))}
  prof=data;tab=NEXT&&(data.role==='admin'||NEXT!=='mem')?NEXT:(data.role==='admin'?'mem':'att');NEXT=null;HOMEV=false;render();
}

function go(k){tab=k;shell()}
async function logout(){await sb.auth.signOut();prof=null;LMODE='home';PUB=false;HOMEV=false;history.replaceState(null,'',location.pathname);render()}

/* ---------- Attendance ---------- */
async function viewAtt(){
  const m=$('#main');
  const {data:gs}=await sb.from('groups').select('id,name_fr,name_en,name_ht').eq('active',true).order('name_fr');
  if(!gs||!gs.length){m.innerHTML=`<p>${t('nog')}</p>`;return}
  m.innerHTML=`<div class="row"><select id="g">${gs.map(g=>`<option value="${g.id}">${gname(g)}</option>`).join('')}</select>
  <button class="btn alt sm" style="flex:none;min-width:0" onclick="shiftD(-7)" aria-label="-7">‹</button><input type="date" id="d" value="${today()}" aria-label="${t('date')}"><button class="btn alt sm" style="flex:none;min-width:0" onclick="shiftD(7)" aria-label="+7">›</button></div>
  <p class="leg">${t('leg')}</p><div id="list"></div><p class="msg" id="m2"></p>`;
  $('#g').onchange=$('#d').onchange=loadAtt;
  loadAtt();
}
function shiftD(n){const i=$('#d');if(!i.value)return;const d=new Date(i.value+'T00:00:00');d.setDate(d.getDate()+n);i.value=ymd(d);loadAtt()}
function attSum(){const c={P:0,R:0,A:0};cur.people.forEach(p=>{if(cur.st[p.id])c[cur.st[p.id]]++});
  const un=cur.people.length-c.P-c.R-c.A;
  return `<div class="sum s4"><div><b>${c.P}</b>${t('P1')}</div><div><b>${c.R}</b>${t('R1')}</div><div><b>${c.A}</b>${t('A1')}</div><div><b>${un}</b>${t('unm')}</div></div><p class="leg">${cur.saved?t('savedyes'):t('savedno')}</p>`}
async function loadAtt(){
  const g=$('#g').value,d=$('#d').value;if(!d)return;
  const {data:mem}=await sb.rpc('group_roster',{gid:g});
  cur.people=(mem||[]).filter(p=>p.active).sort((a,b)=>(a.last_name+a.first_name).localeCompare(b.last_name+b.first_name));
  cur.st={};
  const {data:s}=await sb.from('sessions').select('id').eq('group_id',g).eq('session_date',d).maybeSingle();
  cur.saved=!!s;
  if(s){const {data:a}=await sb.from('attendance').select('person_id,status').eq('session_id',s.id);(a||[]).forEach(r=>cur.st[r.person_id]=r.status)}
  $('#m2').textContent='';drawAtt();
}
function drawAtt(){
  const l=$('#list');if(!l)return;
  if(!cur.people.length){l.innerHTML=`<p>${t('nom')}</p>`;return}
  l.innerHTML=attSum()+cur.people.map(p=>`<div class="pr"><span>${esc(p.first_name)} ${esc(p.last_name)}</span><span class="st">${['P','R','A'].map(k=>`<button class="${k}${cur.st[p.id]===k?' on':''}" onclick="mark('${p.id}','${k}')">${k}</button>`).join('')}</span></div>`).join('')
  +`<div class="row"><button class="btn alt" onclick="restP()">${t('rest')}</button><button class="btn" onclick="saveAtt()">${t('save')}</button></div>`;
}
function mark(id,k){cur.st[id]=k;drawAtt()}
function restP(){cur.people.forEach(p=>{if(!cur.st[p.id])cur.st[p.id]='P'});drawAtt()}
async function saveAtt(){
  const g=$('#g').value,d=$('#d').value,o=$('#m2');
  const {data:s,error:e}=await sb.from('sessions').upsert({group_id:g,session_date:d},{onConflict:'group_id,session_date'}).select('id').single();
  if(e)return o.textContent=t('err')+e.message;
  const rows=cur.people.filter(p=>cur.st[p.id]).map(p=>({session_id:s.id,person_id:p.id,status:cur.st[p.id]}));
  if(rows.length){const {error}=await sb.from('attendance').upsert(rows,{onConflict:'session_id,person_id'});if(error)return o.textContent=t('err')+error.message}
  o.textContent=t('saved');cur.saved=true;drawAtt();
}

/* ---------- Search a name ---------- */
const nrm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function flt(id,sel){const q=nrm($('#'+id).value.trim());let n=0;
  document.querySelectorAll(sel).forEach(el=>{const ok=!q||(el.dataset.s||'').includes(q);el.style.display=ok?'':'none';if(ok)n++});
  const m=$('#fn');if(m)m.textContent=q&&!n?t('sno'):''}

/* ---------- Share: print / PDF, e-mail, WhatsApp ---------- */
let SHARE={subject:'',text:''};
const bar=csvBtn=>`<div class="row noprint"><button class="btn alt" onclick="window.print()">${t('print')}</button><button class="btn alt" onclick="shareTxt('mail')">${t('email')}</button><button class="btn alt" onclick="shareTxt('wa')">WhatsApp</button><button class="btn alt" onclick="shareTxt('copy')">${t('copyt')}</button>${csvBtn?`<button class="btn alt" onclick="csv()">${t('csv')}</button>`:''}</div>`;
function shareTxt(k){const s=SHARE.subject,x=SHARE.text;
  if(k==='mail')location.href='mailto:?subject='+encodeURIComponent(s)+'&body='+encodeURIComponent(x);
  else if(k==='wa')window.open('https://wa.me/?text='+encodeURIComponent(s+'\n\n'+x),'_blank');
  else{if(navigator.clipboard)navigator.clipboard.writeText(s+'\n\n'+x);alert(t('copied'))}}
const gplain=g=>lang==='fr'?g.name_fr:lang==='en'?g.name_en:(g.name_ht||g.name_fr);

/* ---------- Reports ---------- */
const ago=()=>{const d=new Date();d.setMonth(d.getMonth()-3);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
let RP={rows:[]};
const cnt=()=>({P:0,R:0,A:0});
const pct=c=>{const n=c.P+c.R+c.A;return n?Math.round((c.P+c.R)*100/n):null};
const pcH=v=>v===null?'-':v<50?`<span class="low">${v}%</span>`:v+'%';
const tb=(h,rs)=>`<div class="wrap"><table><thead><tr>${h.map((x,i)=>`<th${i?' class="n"':''}>${x}</th>`).join('')}</tr></thead><tbody>${rs.map(r=>`<tr>${r.map((x,i)=>`<td${i?' class="n"':''}>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
async function pages(mk){let out=[],i=0;for(;;){const {data,error}=await mk().range(i,i+999);if(error)throw error;out=out.concat(data);if(data.length<1000)return out;i+=1000}}
function csv(){const x=RP.rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+x],{type:'text/csv'}));a.download='rapport-presences.csv';a.click()}
async function viewRep(){
  const m=$('#main');
  const {data:gs}=await sb.from('groups').select('id,name_fr,name_en,name_ht').eq('active',true).order('name_fr');
  if(!gs||!gs.length){m.innerHTML=`<p>${t('nog')}</p>`;return}
  m.innerHTML=`<div class="row noprint"><select id="rg"><option value="all">${t('allg')}</option>${gs.map(g=>`<option value="${g.id}">${gname(g)}</option>`).join('')}</select><label>${t('from')}<input type="date" id="rf" value="${ago()}"></label><label>${t('to')}<input type="date" id="rt" value="${today()}"></label><button class="btn" onclick="runRep(RP.gs)">${t('gen')}</button></div><div id="rout"></div>`;
  RP.gs=gs;
  ['rg','rf','rt'].forEach(i=>{$('#'+i).onchange=()=>runRep(gs)});
  runRep(gs);
}
async function runRep(gs){
  const g=$('#rg').value,a=$('#rf').value,b=$('#rt').value,o=$('#rout');if(!a||!b)return;
  o.innerHTML='<p class="leg">…</p>';
  let rows;
  try{rows=await pages(()=>{let q=sb.from('attendance').select('status,person_id,session_id,sessions!inner(group_id,session_date)').gte('sessions.session_date',a).lte('sessions.session_date',b).order('session_id').order('person_id');if(g!=='all')q=q.eq('sessions.group_id',g);return q})}
  catch(e){o.innerHTML=`<p>${t('err')}${esc(e.message)}</p>`;return}
  if(!rows.length){o.innerHTML=`<p>${t('nodata')}</p><p class="leg">${t('nodata2')}</p><div class="row"><button class="btn alt" onclick="go('att')">${t('gotoatt')}</button></div>`;return}
  const S={},tot=cnt();
  rows.forEach(r=>{const x=S[r.session_id]??={g:r.sessions.group_id,d:r.sessions.session_date,c:cnt()};x.c[r.status]++;tot[r.status]++});
  const ss=Object.values(S).sort((x,y)=>x.d.localeCompare(y.d)),present=ss.reduce((n,x)=>n+x.c.P+x.c.R,0);
  const title=g==='all'?t('allg'):gname(gs.find(x=>x.id===g));
  const ptitle=g==='all'?t('allg'):gplain(gs.find(x=>x.id===g));
  const hdr=`${CHURCH}\n${t('att')}: ${ptitle}\n${a} / ${b}\n${t('sess')}: ${ss.length}, ${t('avgp')}: ${(present/ss.length).toFixed(1)}, ${t('rate')}: ${pct(tot)}%\n\n`;
  let body;
  if(g==='all'){
    const G={};ss.forEach(x=>{const y=G[x.g]??={n:0,p:0,c:cnt()};y.n++;y.p+=x.c.P+x.c.R;['P','R','A'].forEach(k=>y.c[k]+=x.c[k])});
    const list=gs.filter(x=>G[x.id]).map(x=>[lang==='fr'?x.name_fr:lang==='en'?x.name_en:(x.name_ht||x.name_fr),G[x.id]]);
    RP.rows=[[t('grp'),t('sess'),t('avgp'),t('rate')]].concat(list.map(([n,y])=>[n,y.n,(y.p/y.n).toFixed(1),(pct(y.c)??'')+'%']));
    SHARE={subject:`${CHURCH}: ${t('rep')} ${ptitle}`,text:hdr+list.map(([n,y])=>`- ${n}: ${y.n} ${t('sess')}, ${(y.p/y.n).toFixed(1)} ${t('avgp')}, ${pct(y.c)}%`).join('\n')};
    body=tb([t('grp'),t('sess'),t('avgp'),t('rate')],list.map(([n,y])=>[esc(n),y.n,(y.p/y.n).toFixed(1),pcH(pct(y.c))]));
  }else{
    const M={};
    const {data:mem}=await sb.rpc('group_roster',{gid:g}),NMS={};
    (mem||[]).forEach(p=>{NMS[p.id]=p;if(p.active)M[p.id]={f:p.first_name,l:p.last_name,c:cnt()}});
    rows.forEach(r=>{const p=NMS[r.person_id]||{first_name:'?',last_name:''};const y=M[r.person_id]??={f:p.first_name,l:p.last_name,c:cnt()};y.c[r.status]++});
    const ms=Object.values(M).sort((x,y)=>(x.l+x.f).localeCompare(y.l+y.f));
    RP.rows=[[t('member'),'P','R','A',t('rate')]].concat(ms.map(y=>[y.f+' '+y.l,y.c.P,y.c.R,y.c.A,(pct(y.c)??'')+'%']));
    SHARE={subject:`${CHURCH}: ${t('rep')} ${ptitle}`,text:hdr+t('member')+':\n'+ms.slice(0,40).map(y=>`- ${y.f} ${y.l}: P ${y.c.P}, R ${y.c.R}, A ${y.c.A} (${pct(y.c)??'-'}%)`).join('\n')};
    body=`<h2 class="sp">${t('sess')}</h2>`+tb([t('date'),'P','R','A',t('rate')],ss.map(x=>[x.d,x.c.P,x.c.R,x.c.A,pcH(pct(x.c))]))
      +`<h2 class="sp">${t('member')}</h2>`+tb([t('member'),'P','R','A',t('rate')],ms.map(y=>[esc(y.f+' '+y.l),y.c.P,y.c.R,y.c.A,pcH(pct(y.c))]));
  }
  o.innerHTML=`<div class="prt"><img src="${LOGO}" alt=""><br><strong>${esc(CHURCH)}</strong><br>${title}, ${a} / ${b}</div>
  ${bar(true)}
  <div class="sum"><div><b>${ss.length}</b>${t('sess')}</div><div><b>${(present/ss.length).toFixed(1)}</b>${t('avgp')}</div><div><b>${pct(tot)}%</b>${t('rate')}</div></div>
  <p class="leg">${t('rnote')} ${t('leg')}</p>`+body
  +bar(true);
}

/* ---------- Photos ---------- */
let dmode='fam';
async function urls(ps){ps=[...new Set(ps.filter(Boolean))];if(!ps.length)return{};
  const {data}=await sb.storage.from('photos').createSignedUrls(ps,3600);const o={};(data||[]).forEach(r=>{if(r.signedUrl)o[r.path]=r.signedUrl});return o}
const av=(p,u)=>u[p.photo_path]?`<img class="ph" src="${u[p.photo_path]}" alt="">`:`<span class="ph">${esc((p.first_name[0]||'')+(p.last_name[0]||''))}</span>`;
async function shrink(file){const b=await createImageBitmap(file),k=Math.min(1,600/Math.max(b.width,b.height)),c=document.createElement('canvas');
  c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,'image/jpeg',.8))}
async function upPhoto(id,file,sh){
  const blob=await shrink(file),path=id+'.jpg';
  const {error}=await sb.storage.from('photos').upload(path,blob,{upsert:true,contentType:'image/jpeg'});if(error)throw error;
  const {error:e2}=await sb.from('people').update(Object.assign({photo_path:path},sh===undefined?{}:{share_photo:sh})).eq('id',id);if(e2)throw e2}
async function setPhoto(id,file){if(!file)return;
  try{await upPhoto(id,file,confirm(t('sharep')));viewPpl()}catch(err){alert(t('err')+err.message)}}

  m.innerHTML=`<div class="prt"><img src="${LOGO}" alt=""><br><strong>${esc(CHURCH)}</strong><br>${today()}, ${t('membersonly')}</div><div class="row noprint"><button class="btn${dmode==='fam'?'':' alt'}" onclick="dmode='fam';viewDir()">${t('fams')}</button><button class="btn${dmode==='ind'?'':' alt'}" onclick="dmode='ind';viewDir()">${t('inds')}</button><button class="btn alt" onclick="window.print()">${t('print')}</button></div><div class="noprint"><input id="dsq" type="search" class="srch" placeholder="${t('searchname')}" oninput="flt('dsq','#main [data-s]')" autocomplete="off"><p class="leg" id="fn"></p></div>`+body;

function showPane(f,i){i=String(i);f.querySelectorAll('.pane').forEach(p=>p.classList.toggle('off',p.dataset.i!==i));f.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.dataset.i===i))}
function stepPane(f,d){const ps=[...f.querySelectorAll('.pane')].filter(p=>p.style.display!=='none'),cur=ps.findIndex(p=>!p.classList.contains('off'));

function sync(f){
  const E=f.elements,kid=E.role.value==='child';
  f.querySelectorAll('.adult').forEach(d=>{d.style.display=kid?'none':''});

  const hn=f.querySelector('#hnw');if(hn&&E.hid)hn.style.display=E.hid.value==='new'?'':'none';
  f.querySelectorAll('[data-dep]').forEach(d=>{const [n,v]=d.dataset.dep.split('='),k=!!d.closest('.kidonly'),el=E[n],show=(k?kid:!kid)&&!!el&&el.value===v;
    d.style.display=show?'':'none';d.querySelectorAll('input,select,textarea').forEach(x=>{x.required=show})});

function fill(f,o){Object.entries(o).forEach(([k,v])=>{if(v==null)return;const els=[...f.querySelectorAll(`[name="${k}"]`)];if(!els.length||els[0].type==='file')return;
  if(els[0].type==='checkbox'){if(Array.isArray(v))els.forEach(x=>{x.checked=v.includes(x.value)});else els[0].checked=!!v}
  else els[0].value=v})}
function serialize(f){const v={};
  [...f.elements].forEach(el=>{
    if(!el.name||el.type==='file'||el.type==='button'||el.type==='submit')return;
    for(let n=el;n&&n!==f;n=n.parentElement)if(n.style&&n.style.display==='none')return;
    if(el.type==='checkbox'){if(el.hasAttribute('value')){(v[el.name]??=[]);if(el.checked)v[el.name].push(el.value)}else v[el.name]=el.checked}
    else v[el.name]=el.value.trim()});
  return v}
const A=(v,pre)=>{const o={};Object.entries(v).forEach(([k,x])=>{if(k.startsWith(pre)){const y=Array.isArray(x)?(x.length?x:''):x;if(y)o[k.slice(2)]=y}});return o};
async function store(v,o){
  const pick=(x,l)=>l.includes(x)?x:null;
  const pr={household_id:o.hid,household_role:pick(v.role,['self','husband','wife','child','other']),first_name:v.first,last_name:v.last,phone:v.phone||null,email:v.email||null,
    share_address:!!v.share_address,share_phone:!!v.share_phone,share_email:!!v.share_email,share_birthday:!!v.share_birthday,share_photo:!!v.share_photo};
  if(/^pending\/[0-9a-f-]{36}\.jpg$/.test(v.photo_path||''))pr.photo_path=v.photo_path;
  let pid=o.id;
  if(pid){const {error}=await sb.from('people').update(pr).eq('id',pid);if(error)throw error}
  else{const {data,error}=await sb.from('people').insert(pr).select('id').single();if(error)throw error;pid=data.id}
  const ans=Object.assign(A(v,'a_'),A(v,'k_'),o.full?A(v,'b_'):{});if(v.mtype)ans.member_type=v.mtype;
  const {error:e2}=await sb.from('people_private').upsert({person_id:pid,dob:v.dob||null,marital_status:pick(v.mar,['single','married','separated','divorced','widowed']),
    sex:pick(v.sex,['M','F']),preferred_name:v.pref||null,occupation:v.job||null,spouse_name:v.spouse||null,marriage_date:v.mdate||null,answers:ans,consent_at:today()},{onConflict:'person_id'});
  if(e2)throw e2;
  if(o.full){
    await sb.from('memberships').delete().eq('person_id',pid);
    const ids=v.gr||[];if(ids.length){const {error}=await sb.from('memberships').insert(ids.map(group_id=>({group_id,person_id:pid})));if(error)throw error}
  }
  return pid;
}

async function savePerson(e){
  e.preventDefault();
  const f=e.target,o=$('#m3'),id=f.dataset.id||null;
  if(!goInvalid(f))return;
  const v=serialize(f);
  if(!v.consent){lastPane(f);o.textContent=tr('Cochez le consentement avant d’enregistrer.');return}
  try{
    let hid=v.hid;const H={address:v.adr||null,city:v.city||null};
    if(!hid||hid==='new'){const {data,error}=await sb.from('households').insert(Object.assign({name:v.hn||v.last},H)).select('id').single();if(error)throw error;hid=data.id}
    else if(H.address||H.city){const {error}=await sb.from('households').update(H).eq('id',hid);if(error)throw error}
    const pid=await store(v,{hid,id,full:true});
    const ph=f.elements.photo.files[0];if(ph)await upPhoto(pid,ph);
    if(!id)localStorage.removeItem('adraft');
    viewPpl();
  }catch(err){o.textContent=t('err')+err.message}
}

    for(const v of L){pm[v.k]=await store(v,{hid,id:pm[v.k]||null})}

  const all=g.data||[],on=all.filter(x=>x.active),off=all.filter(x=>!x.active);
  const cats=[...new Set(all.map(x=>x.category).filter(Boolean))].sort();
  const row=x=>`<div class="pr"><span><strong>${gname(x)}</strong><br><small class="mut">${cnt[x.id]||0} ${t('mem')}${lead[x.id]?', '+esc(lead[x.id].join(', ')):''}</small></span><button class="btn alt sm" onclick="openMin('${x.id}')">${adm?t('edit'):t('mem')}</button></div>`;
  const by={};on.forEach(x=>{(by[x.category||'']??=[]).push(x)});
  const keys=Object.keys(by).sort((x,y)=>(x===''?1:0)-(y===''?1:0)||x.localeCompare(y));
  m.innerHTML=(adm?`<details><summary class="btn">${t('addmin')}</summary><form onsubmit="addMin(event)">${minForm(null,cats)}<button class="btn">${t('save')}</button><p class="msg" id="mm"></p></form></details>`:'')
   +keys.map(k=>(k?`<h2 class="sp">${esc(k)}</h2>`:(keys.length>1?`<h2 class="sp">${t('othercat')}</h2>`:''))+by[k].map(row).join('')).join('')
   +(adm&&off.length?`<h2 class="sp">${t('inactive')}</h2>`+off.map(x=>`<div class="pr"><span>${gname(x)}</span><button class="btn alt sm" onclick="setMinActive('${x.id}',true)">${t('react')}</button></div>`).join(''):'');
}
async function addMin(e){e.preventDefault();const f=e.target,v=n=>f.elements[n].value.trim();
  const {error}=await sb.from('groups').insert({name_fr:v('fr'),name_en:v('en'),name_ht:v('ht')||null,category:v('cat')||null});
  if(error)return $('#mm').textContent=t('err')+error.message;viewMin()}
async function saveMin(e,gid){e.preventDefault();const f=e.target,v=n=>f.elements[n].value.trim();
  const {error}=await sb.from('groups').update({name_fr:v('fr'),name_en:v('en'),name_ht:v('ht')||null,category:v('cat')||null}).eq('id',gid);
  if(error)return f.querySelector('.msg').textContent=t('err')+error.message;openMin(gid)}
async function setMinActive(gid,on){if(!on&&!confirm(t('deact')+' ?'))return;await sb.from('groups').update({active:on}).eq('id',gid);viewMin()}
let MIN_IDS=new Set();
async function openMin(gid){
  const m=$('#main'),adm=prof.role==='admin';
  const [g,mm,ld,pf,gs]=await Promise.all([
    sb.from('groups').select('id,name_fr,name_en,name_ht,category').eq('id',gid).single(),
    sb.rpc('group_roster',{gid}),
    adm?sb.from('group_leaders').select('user_id').eq('group_id',gid):{data:[]},
    adm?sb.from('profiles').select('id,full_name').order('full_name'):{data:[]},
    adm?sb.from('groups').select('id,name_fr,name_en,name_ht').eq('active',true).order('name_fr'):{data:[]}]);
  const mem=(mm.data||[]).filter(p=>p.active);
  MIN_IDS=new Set(mem.map(p=>p.id));
  const lids=new Set((ld.data||[]).map(x=>x.user_id)),leaders=(pf.data||[]).filter(x=>lids.has(x.id));
  const cats=adm?[...new Set((gs.data||[]).map(x=>x.category).filter(Boolean))]:[];
  m.innerHTML=`<p><button class="btn alt sm" onclick="viewMin()">${t('back')}</button></p><h2>${gname(g.data)}</h2>`
  +(adm?`<details><summary class="btn alt">${t('edit')} ${t('minist')}</summary><form onsubmit="saveMin(event,'${gid}')">${minForm(g.data,cats)}<div class="row"><button class="btn">${t('save')}</button><button type="button" class="btn alt" onclick="setMinActive('${gid}',false)">${t('deact')}</button></div><p class="msg"></p></form></details>`:'')
  +(adm?`<h2 class="sp">${t('leaders')}</h2>`+leaders.map(x=>`<div class="pr"><span>${esc(x.full_name)}</span><button class="btn alt sm" onclick="rmLeader('${gid}','${x.id}')">${t('remove')}</button></div>`).join('')
    +`<div class="row"><select id="al">${(pf.data||[]).filter(x=>!lids.has(x.id)).map(x=>`<option value="${x.id}">${esc(x.full_name)}</option>`).join('')}</select><button class="btn alt" onclick="addLeader('${gid}')">${t('addleader')}</button></div>
    <details><summary class="btn alt">${t('staffnote')}</summary><form onsubmit="newStaff(event,'${gid}')"><div class="row"><input name="n" placeholder="${t('first')} ${t('last')}" required><input name="e" type="email" placeholder="${t('email')}" required></div><button class="btn">${t('save')}</button><p class="msg"></p></form></details>`:'')
  +`<h2 class="sp">${t('mem')} (${mem.length})</h2>`+mem.map(p=>`<div class="pr"><span>${esc(p.first_name)} ${esc(p.last_name)}</span><button class="btn alt sm" onclick="rmMember('${gid}','${p.id}')">${t('remove')}</button></div>`).join('')
  +`<div class="row"><input id="sq" placeholder="${t('searchmem')}" oninput="srch('${gid}')" autocomplete="off"></div><div id="sr"></div>`
  +(adm?`<div class="row"><select id="cs">${(gs.data||[]).filter(x=>x.id!==gid).map(x=>`<option value="${x.id}">${gname(x)}</option>`).join('')}</select><button class="btn alt" onclick="copyMembers('${gid}')">${t('copym')} ${t('copyb')}</button></div>`:'');
}
function srch(gid){later(async()=>{const q=$('#sq').value.trim(),r=$('#sr');if(!r)return;if(q.length<2){r.innerHTML='';return}
  const {data}=await sb.rpc('search_people',{q});const L=(data||[]).filter(p=>!MIN_IDS.has(p.id));
  r.innerHTML=L.length?L.map(p=>`<div class="pr"><span>${esc(p.first_name)} ${esc(p.last_name)}</span><button class="btn sm" onclick="addMember('${gid}','${p.id}')">${t('addbtn')}</button></div>`).join(''):`<p class="leg">${t('sno')}</p>`},350)}
async function addMember(g,pid){const {error}=await sb.from('memberships').insert({group_id:g,person_id:pid});if(error)return alert(t('err')+error.message);openMin(g)}
async function rmMember(g,p){await sb.from('memberships').delete().eq('group_id',g).eq('person_id',p);openMin(g)}
async function copyMembers(g){const src=$('#cs').value;if(!src)return;
  const {data}=await sb.from('memberships').select('person_id').eq('group_id',src);
  if(data&&data.length){const {error}=await sb.from('memberships').upsert(data.map(x=>({group_id:g,person_id:x.person_id})),{onConflict:'group_id,person_id',ignoreDuplicates:true});if(error)return alert(t('err')+error.message)}
  openMin(g)}
async function addLeader(g){const id=$('#al').value;if(!id)return;await sb.from('group_leaders').insert({group_id:g,user_id:id});openMin(g)}
async function rmLeader(g,u){await sb.from('group_leaders').delete().eq('group_id',g).eq('user_id',u);openMin(g)}
async function newStaff(e,g){e.preventDefault();const f=e.target,o=f.querySelector('.msg');
  const {error}=await sb.rpc('add_staff',{p_email:f.elements.e.value.trim(),p_name:f.elements.n.value.trim(),p_role:'leader'});
  if(error)return o.textContent=t('err')+error.message;openMin(g)}

/* ---------- Calendar of events ---------- */
let calM=(()=>{const d=new Date();d.setDate(1);return d})();
const ymd=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const loc=()=>lang==='en'?'en':'fr';
function calGo(n){calM=new Date(calM.getFullYear(),calM.getMonth()+n,1);viewCal()}
async function viewCal(){
  const m=$('#main'),adm=prof.role==='admin',y=calM.getFullYear(),mo=calM.getMonth();
  const [ev,g]=await Promise.all([
    sb.from('events').select('*,groups(name_fr,name_en,name_ht)').gte('event_date',ymd(new Date(y,mo,1))).lte('event_date',ymd(new Date(y,mo+1,0))).order('event_date').order('start_time'),
    sb.from('groups').select('id,name_fr,name_en,name_ht').eq('active',true).order('name_fr')]);
  if(ev.error)return m.innerHTML=`<p>${t('err')}${esc(ev.error.message)}</p>`;
  const G=g.data||[],mine=new Set(G.map(x=>x.id)),L=ev.data||[];
  const title=calM.toLocaleDateString(loc(),{month:'long',year:'numeric'});
  SHARE={subject:`${CHURCH}: ${t('cal')} ${title}`,text:`${CHURCH}\n${title}\n\n`+(L.length?L.map(x=>{const tm=[x.start_time,x.end_time].filter(Boolean).map(v=>v.slice(0,5)).join('-');return `- ${x.event_date.slice(8)}/${x.event_date.slice(5,7)} ${x.title}${tm?', '+tm:''}${x.location?', '+x.location:''}`}).join('\n'):t('noev'))};
  const form=(adm||G.length)?`<details><summary class="btn">${t('addev')}</summary><form id="ef" onsubmit="saveEv(event)">
   <label>${t('evtitle')}<input name="title" required></label>
   <div class="row"><label>${t('date')}<input name="d" type="date" value="${ymd(new Date())}" required></label><label>${t('start')}<input name="s" type="time"></label><label>${t('end')}<input name="e" type="time"></label></div>
   <label>${t('minist')}<select name="g">${adm?`<option value="">${t('whole')}</option>`:''}${G.map(x=>`<option value="${x.id}">${gname(x)}</option>`).join('')}</select></label>
   <label>${t('loc')}<input name="l"></label><label>${t('lnote')}<input name="n"></label>
   <button class="btn">${t('save')}</button><p class="msg" id="em"></p></form></details>`:'';
  m.innerHTML=`<div class="prt"><img src="${LOGO}" alt=""><br><strong>${esc(CHURCH)}</strong><br>${esc(title)}</div>
  <div class="row noprint"><button class="btn alt" onclick="calGo(-1)" aria-label="‹">‹</button><h2 style="flex:3;text-align:center;align-self:center">${esc(title)}</h2><button class="btn alt" onclick="calGo(1)" aria-label="›">›</button></div>`
  +`<div class="noprint">${form}</div>`+bar(false)
  +(L.length?L.map(x=>{const d=new Date(x.event_date+'T00:00:00'),tm=[x.start_time,x.end_time].filter(Boolean).map(v=>v.slice(0,5)).join(' - ');
    const gn=x.groups?gname(x.groups):t('whole');
    return `<div class="pr"><span class="mb"><span class="ph">${d.getDate()}</span><span><strong>${esc(x.title)}</strong><br><small class="mut">${esc(d.toLocaleDateString(loc(),{weekday:'long'}))}${tm?', '+esc(tm):''}${x.location?', '+esc(x.location):''}<br>${gn}${x.notes?', '+esc(x.notes):''}</small></span></span>${adm||(x.group_id&&mine.has(x.group_id))?`<button class="btn alt sm noprint" onclick="delEv('${x.id}')">${t('del')}</button>`:''}</div>`}).join(''):`<p>${t('noev')}</p>`)
  +bar(false);
}
async function saveEv(e){e.preventDefault();const f=e.target,v=n=>f.elements[n].value.trim();
  const {error}=await sb.from('events').insert({title:v('title'),event_date:v('d'),start_time:v('s')||null,end_time:v('e')||null,group_id:v('g')||null,location:v('l')||null,notes:v('n')||null});
  if(error)return $('#em').textContent=t('err')+error.message;
  const d=new Date(v('d')+'T00:00:00');calM=new Date(d.getFullYear(),d.getMonth(),1);viewCal()}
async function delEv(id){if(!confirm(t('del')+' ?'))return;await sb.from('events').delete().eq('id',id);viewCal()}

/* ---------- Public form: no login needed ---------- */
let PUB=false,PTOK=null,pubView=()=>{};
function pubGo(){history.replaceState(null,'','#join');pubStart()}
function pubStart(){PUB=true;const h=location.hash;if(h.startsWith('#edit='))loadEdit(h.slice(6));else{PTOK=null;pubView=()=>pubForm(pubSnapshot());let d=null;try{d=JSON.parse(localStorage.getItem('fdraft')||'null')}catch(e){}if(d)d._draft=1;pubForm(d)}}
function pubShell(a){$('#app').innerHTML=`<header><span class="brand"><img class="lg" src="${LOGO}" alt=""><h1>${esc(CHURCH)}</h1></span>${tools(prof?`<button onclick="logout()">${t('out')}</button>`:'')}</header>${gnav(a||(PTOK?'reg':'new'))}<main id="main"></main>`}
function pubSnapshot(){if(!$('#cards'))return null;
  return {adr:$('#fadr').value,city:$('#fcity').value,consent:$('#pc').checked,
    people:[...document.querySelectorAll('.pcard')].map(c=>Object.assign(serialize(c.querySelector('form')),{k:c.dataset.k},c.dataset.photo?{photo_path:c.dataset.photo}:{}))}}
function pubForm(S){
  pubShell();
  const tk=localStorage.getItem('ftok');
  $('#main').innerHTML=`<h2>${t('pubtitle')}</h2><p class="leg">${PTOK?t('editnote'):t('pubintro')}</p>${S&&S._draft?`<p class="leg">${t('draftrest')} <a href="#" onclick="pubReset();return false">${t('restart')}</a></p>`:''}
  ${!PTOK&&tk?`<p><a href="#edit=${esc(tk)}" onclick="loadEdit('${esc(tk)}');return false">${t('myform')}</a></p>`:''}
  
  <div id="cards"></div>
  <div class="row"><button type="button" class="btn alt" onclick="addCard()">${t('addm')}</button></div>
  <div class="sec"><div><strong>${t('famaddr')}</strong> <small class="mut">${t('famaddrnote')}</small><div class="row"><input id="fadr" placeholder="${t('adr')}"><input id="fcity" placeholder="${t('city')}"></div></div></div>
  <input id="hp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
  <label class="chk"><input type="checkbox" id="pc"> ${CONSENT}</label>
  <p class="msg" id="pm"></p><div class="row"><button class="btn" id="pb" onclick="pubSend()">${t('send')}</button>${PTOK?'':`<button type="button" class="btn alt" onclick="pubLater()">${t('laterbtn')}</button>`}</div>`;
  const d=S||{people:[{role:'self'}]};
  $('#fadr').value=d.adr||'';$('#fcity').value=d.city||'';
  (d.people&&d.people.length?d.people:[{role:'self'}]).forEach(v=>addCard(v));
  $('#pc').checked=!!d.consent;tx($('#main'));
  $('#main').addEventListener('input',pubAuto);$('#main').addEventListener('change',pubAuto);
}
function addCard(v){
  v=v||{};const n=document.querySelectorAll('.pcard').length;
  const box=document.createElement('div');box.className='pcard';box.dataset.k=v.k||Math.random().toString(36).slice(2,10);if(v.photo_path)box.dataset.photo=v.photo_path;
  box.innerHTML=`<details class="sec" open><summary>${n?t('fmem'):t('you')}</summary><div><form class="pf" onsubmit="return false">${formHTML({pub:true})}</form>${n?`<p><button type="button" class="btn alt sm" onclick="this.closest('.pcard').remove()">${t('remove')}</button></p>`:''}</div></details>`;
  $('#cards').appendChild(box);
  const f=box.querySelector('form');
  if(!n&&!v.role)v.role='self';
  fill(f,v);tx(f);f.addEventListener('change',()=>sync(f));sync(f);
  if(v.photo_path){const pm=f.querySelector('[data-pm]');if(pm)pm.textContent='✓'}
}
async function pubPhoto(el){
  const file=el.files[0],box=el.closest('.pcard'),pm=el.parentElement.querySelector('[data-pm]');if(!file)return;
  try{const blob=await shrink(file),path='pending/'+crypto.randomUUID()+'.jpg';
    const {error}=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg'});if(error)throw error;
    box.dataset.photo=path;pm.textContent='✓'}
  catch(err){pm.textContent=t('err')+err.message}
}
async function pubSend(){
  const fs=[...document.querySelectorAll('.pcard form')],o=$('#pm');
  for(const f of fs){
    const x=f.querySelector(':invalid');if(x){for(let d=x.closest('details');d;d=d.parentElement&&d.parentElement.closest('details'))d.open=true}
    if(!goInvalid(f))return;
  }
  if(!$('#pc').checked){o.textContent=tr('Cochez le consentement avant d’enregistrer.');return}
  if($('#hp').value)return;
  const snap=pubSnapshot(),p={adr:snap.adr.trim(),city:snap.city.trim(),people:snap.people};
  const b=$('#pb');b.disabled=true;
  const {data,error}=PTOK?await sb.rpc('update_form',{tok:PTOK,p}):await sb.rpc('submit_form',{p});
  b.disabled=false;
  if(error)return o.textContent=t('err')+error.message;
  const tok=PTOK||data;localStorage.setItem('ftok',tok);localStorage.removeItem('fdraft');pubDone(tok);
}
const pubAuto=()=>later(()=>{if(PTOK||!$('#cards'))return;try{localStorage.setItem('fdraft',JSON.stringify(pubSnapshot()))}catch(e){}});
function pubReset(){localStorage.removeItem('fdraft');pubForm(null)}
function pubLaterPage(){pubShell();$('#main').innerHTML=`<h2>${t('later')}</h2><p>${t('laterhow')}</p><div class="row"><button class="btn" onclick="pubStart()">${t('cont')}</button></div>`;pubView=pubLaterPage}
function pubLater(){const sn=pubSnapshot();if(sn&&!PTOK){try{localStorage.setItem('fdraft',JSON.stringify(sn))}catch(e){}}pubLaterPage()}
function pubDone(tok){
  pubShell();const url=location.origin+location.pathname+'#edit='+tok;
  $('#main').innerHTML=`<h2>${t('thanks')}</h2><p>${t('keeplink')}</p><p class="mut" style="word-break:break-all">${esc(url)}</p><div class="row"><button class="btn" id="cp">${t('copy')}</button></div>`;
  $('#cp').onclick=()=>{if(navigator.clipboard)navigator.clipboard.writeText(url);$('#cp').textContent='✓'};
  pubView=()=>pubDone(tok);
}
function regGo(){
  const tk=localStorage.getItem('ftok');
  if(tk){history.replaceState(null,'','#edit='+tk);loadEdit(tk);return}
  PUB=true;pubShell('reg');regPage();
}
function regPage(msg){
  $('#main').innerHTML=`<h2>${t('reg')}</h2><p class="leg">${t('regnote')}</p><div class="row"><input id="rtk" placeholder="${t('regph')}" autocomplete="off"></div><p class="msg" id="rm">${msg||''}</p><div class="row"><button class="btn" onclick="regOpen()">${t('regopen')}</button><button class="btn alt" onclick="location.href=location.pathname">${t('back')}</button></div>`;
  pubView=()=>regPage();
}
function regOpen(){
  const m=$('#rtk').value.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
  if(!m)return $('#rm').textContent=t('notfound');
  history.replaceState(null,'','#edit='+m[0].toLowerCase());loadEdit(m[0].toLowerCase());
}
async function loadEdit(tok){
  PUB=true;pubShell('reg');$('#main').innerHTML='<p>…</p>';
  const {data,error}=await sb.rpc('get_form',{tok});
  if(error||!data){$('#main').innerHTML=`<p>${t('notfound')}</p><div class="row"><button class="btn alt" onclick="location.href=location.pathname">${t('back')}</button></div>`;return}
  try{localStorage.setItem('ftok',tok)}catch(e){}
  PTOK=tok;pubView=()=>pubForm(pubSnapshot());
  const P=data.payload;pubForm({adr:P.adr,city:P.city,people:P.people,consent:true});
}

if(/^#(join|edit=)/.test(location.hash))pubStart();else boot();
</script>
</body>
