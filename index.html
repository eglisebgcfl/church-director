<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Annuaire</title>
<style>
:root{--bg:#f5f6fa;--ink:#1c2233;--mut:#5b6479;--pri:#2e3a8c;--onpri:#fff;--acc:#e41f26;--card:#fff;--ln:#dde1ea;--ok:#2e7d4f;--wa:#b7791f;--no:#b23a3a;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#12141f;--ink:#e8eaf3;--mut:#a3a9bf;--pri:#8f9cf0;--onpri:#10132a;--acc:#ff6b70;--card:#1b1e2e;--ln:#2f3350;--ok:#5cc08a;--wa:#e0a84f;--no:#e07a7a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0}
header{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;padding:.5rem 1rem;background:#fff;color:#2e3a8c;border-bottom:4px solid var(--acc)}
header h1{font-size:1rem;line-height:1.2;max-width:15rem}
.brand{display:flex;align-items:center;gap:.6rem}
.lg{height:3.4rem;width:auto}
.lgl{display:block;margin:0 auto;width:22rem;max-width:100%;height:auto;background:#fff;border-radius:8px;padding:.5rem}
.prt{display:none}
.tools{display:flex;gap:.35rem}
.tools button{background:transparent;color:inherit;border:1px solid currentColor;border-radius:6px;padding:.3rem .6rem;font:inherit;cursor:pointer}
.login .tools{justify-content:flex-end;color:var(--pri)}
nav{display:flex;gap:.25rem;padding:0 1rem;border-bottom:1px solid var(--ln);background:var(--card);overflow-x:auto}
nav button{background:none;border:0;padding:.8rem 1rem;font:inherit;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-color:var(--acc);font-weight:600}
main{max-width:46rem;margin:0 auto;padding:1rem}
.login{max-width:24rem;margin-top:12vh}
.login h1{font-size:1.15rem;margin:.75rem 0 1rem;text-align:center}
label{display:block;margin:.5rem 0;flex:1}
input,select,textarea{font:inherit;padding:.55rem .7rem;border:1px solid var(--ln);border-radius:6px;background:var(--card);color:var(--ink);width:100%}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0}
.row>*{flex:1;min-width:9rem}
.btn{background:var(--pri);color:var(--onpri);border:0;padding:.65rem 1.1rem;border-radius:6px;font:inherit;cursor:pointer;list-style:none}
.btn.alt{background:none;color:var(--pri);border:1px solid var(--pri)}
summary::-webkit-details-marker{display:none}
.pr{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.6rem 0;border-bottom:1px solid var(--ln)}
.st{display:flex;gap:.35rem}
.st button{width:2.6rem;height:2.6rem;border-radius:6px;border:1px solid var(--ln);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.st .P.on{background:var(--ok);border-color:var(--ok);color:#fff}
.st .R.on{background:var(--wa);border-color:var(--wa);color:#fff}
.st .A.on{background:var(--no);border-color:var(--no);color:#fff}
.fam{padding:.8rem 0;border-bottom:1px solid var(--ln)}
.fam h2{font-size:1.1rem;margin-bottom:.25rem}
.fam p{margin:.35rem 0}
fieldset{border:1px solid var(--ln);border-radius:6px;margin:.75rem 0}
.chk{display:inline-flex;align-items:center;gap:.4rem;margin:.25rem .75rem .25rem 0}
.chk input{width:auto}
.mut,.leg{color:var(--mut)}
.leg{font-size:.9rem;margin:.25rem 0 .5rem}
.msg{color:var(--mut);min-height:1.4em}
.sp{margin:1.5rem 0 .5rem;font-size:1.1rem}
details form{padding:.75rem 0}
.sec{border:1px solid var(--ln);border-radius:6px;margin:.5rem 0;background:var(--card)}
.sec>summary{padding:.7rem .9rem;cursor:pointer;font-weight:600}
.sec>summary::after{content:"+";float:right}
.sec[open]>summary::after{content:"−"}
.sec>div{padding:0 .9rem .9rem}
.ph{width:4.5rem;height:4.5rem;border-radius:6px;object-fit:cover;background:var(--ln);display:inline-flex;align-items:center;justify-content:center;font-weight:600;color:var(--mut);flex:none}
.mb{display:flex;gap:.75rem;align-items:flex-start}
.mb p{margin:0}
.mem{display:flex;flex-wrap:wrap;gap:1rem}
.ind{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:.75rem}
.card{border:1px solid var(--ln);border-radius:6px;padding:.6rem;background:var(--card)}
.sm{padding:.35rem .7rem;font-size:.9rem;cursor:pointer;white-space:nowrap}
.fam,.card{break-inside:avoid}
.lf{padding:.5rem 0 1rem;border-bottom:1px solid var(--ln)}
.acts{display:flex;gap:.35rem}
.pcard{margin:.75rem 0}
a{color:var(--pri)}
table{width:100%;border-collapse:collapse}
th,td{padding:.45rem .5rem;border-bottom:1px solid var(--ln);text-align:left}
th{font-weight:600;color:var(--mut)}
.n{text-align:right}
.low{color:var(--no);font-weight:600}
.wrap{overflow-x:auto}
.sum{display:flex;gap:.75rem;flex-wrap:wrap;margin:.75rem 0}
.sum div{flex:1;min-width:8rem;border:1px solid var(--ln);border-radius:6px;padding:.6rem;background:var(--card)}
.sum b{display:block;font-size:1.5rem;font-family:Georgia,"Times New Roman",serif}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media print{header,nav,.noprint{display:none!important}body{background:#fff;color:#000}.prt{display:block!important;text-align:center;margin-bottom:1rem}.prt img{height:5rem}}
</style>

/* ---------- Attendance ---------- */
async function viewAtt(){
  const m=$('#main');
  const {data:gs}=await sb.from('groups').select('id,name_fr,name_en,name_ht').eq('active',true).order('name_fr');
  if(!gs||!gs.length){m.innerHTML=`<p>${t('nog')}</p>`;return}
  m.innerHTML=`<div class="row"><select id="g">${gs.map(g=>`<option value="${g.id}">${gname(g)}</option>`).join('')}</select>
  <input type="date" id="d" value="${today()}" aria-label="${t('date')}"></div>
  <p class="leg">${t('leg')}</p><div id="list"></div><p class="msg" id="m2"></p>`;
  $('#g').onchange=$('#d').onchange=loadAtt;
  loadAtt();
}
async function loadAtt(){
  const g=$('#g').value,d=$('#d').value;if(!d)return;
  const {data:mem}=await sb.from('memberships').select('people(id,first_name,last_name,active)').eq('group_id',g);
  cur.people=(mem||[]).map(x=>x.people).filter(p=>p&&p.active).sort((a,b)=>(a.last_name+a.first_name).localeCompare(b.last_name+b.first_name));
  cur.st={};
  const {data:s}=await sb.from('sessions').select('id').eq('group_id',g).eq('session_date',d).maybeSingle();
  if(s){const {data:a}=await sb.from('attendance').select('person_id,status').eq('session_id',s.id);(a||[]).forEach(r=>cur.st[r.person_id]=r.status)}
  $('#m2').textContent='';drawAtt();
}
function drawAtt(){
  const l=$('#list');if(!l)return;
  if(!cur.people.length){l.innerHTML=`<p>${t('nom')}</p>`;return}
  l.innerHTML=cur.people.map(p=>`<div class="pr"><span>${esc(p.first_name)} ${esc(p.last_name)}</span><span class="st">${['P','R','A'].map(k=>`<button class="${k}${cur.st[p.id]===k?' on':''}" onclick="mark('${p.id}','${k}')">${k}</button>`).join('')}</span></div>`).join('')
  +`<div class="row"><button class="btn alt" onclick="restP()">${t('rest')}</button><button class="btn" onclick="saveAtt()">${t('save')}</button></div>`;
}
function mark(id,k){cur.st[id]=k;drawAtt()}
function restP(){cur.people.forEach(p=>{if(!cur.st[p.id])cur.st[p.id]='P'});drawAtt()}
async function saveAtt(){
  const g=$('#g').value,d=$('#d').value,o=$('#m2');
  const {data:s,error:e}=await sb.from('sessions').upsert({group_id:g,session_date:d},{onConflict:'group_id,session_date'}).select('id').single();
  if(e)return o.textContent=t('err')+e.message;
  const rows=cur.people.filter(p=>cur.st[p.id]).map(p=>({session_id:s.id,person_id:p.id,status:cur.st[p.id]}));
  if(rows.length){const {error}=await sb.from('attendance').upsert(rows,{onConflict:'session_id,person_id'});if(error)return o.textContent=t('err')+error.message}
  o.textContent=t('saved');
}

const ago=()=>{const d=new Date();d.setMonth(d.getMonth()-3);return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
let RP={rows:[]};
const cnt=()=>({P:0,R:0,A:0});
const pct=c=>{const n=c.P+c.R+c.A;return n?Math.round((c.P+c.R)*100/n):null};
const pcH=v=>v===null?'-':v<50?`<span class="low">${v}%</span>`:v+'%';
const tb=(h,rs)=>`<div class="wrap"><table><thead><tr>${h.map((x,i)=>`<th${i?' class="n"':''}>${x}</th>`).join('')}</tr></thead><tbody>${rs.map(r=>`<tr>${r.map((x,i)=>`<td${i?' class="n"':''}>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
async function pages(mk){let out=[],i=0;for(;;){const {data,error}=await mk().range(i,i+999);if(error)throw error;out=out.concat(data);if(data.length<1000)return out;i+=1000}}
function csv(){const x=RP.rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+x],{type:'text/csv'}));a.download='rapport-presences.csv';a.click()}
async function viewRep(){
  const m=$('#main');
  const {data:gs}=await sb.from('groups').select('id,name_fr,name_en,name_ht').eq('active',true).order('name_fr');
  if(!gs||!gs.length){m.innerHTML=`<p>${t('nog')}</p>`;return}
  m.innerHTML=`<div class="row noprint"><select id="rg"><option value="all">${t('allg')}</option>${gs.map(g=>`<option value="${g.id}">${gname(g)}</option>`).join('')}</select><label>${t('from')}<input type="date" id="rf" value="${ago()}"></label><label>${t('to')}<input type="date" id="rt" value="${today()}"></label></div><div id="rout"></div>`;
  ['rg','rf','rt'].forEach(i=>{$('#'+i).onchange=()=>runRep(gs)});
  runRep(gs);
}
async function runRep(gs){
  const g=$('#rg').value,a=$('#rf').value,b=$('#rt').value,o=$('#rout');if(!a||!b)return;
  o.innerHTML='';
  let rows;
  try{rows=await pages(()=>{let q=sb.from('attendance').select('status,person_id,session_id,people(first_name,last_name),sessions!inner(group_id,session_date)').gte('sessions.session_date',a).lte('sessions.session_date',b).order('session_id').order('person_id');if(g!=='all')q=q.eq('sessions.group_id',g);return q})}
  catch(e){o.innerHTML=`<p>${t('err')}${esc(e.message)}</p>`;return}
  if(!rows.length){o.innerHTML=`<p>${t('nodata')}</p>`;return}
  const S={},tot=cnt();
  rows.forEach(r=>{const x=S[r.session_id]??={g:r.sessions.group_id,d:r.sessions.session_date,c:cnt()};x.c[r.status]++;tot[r.status]++});
  const ss=Object.values(S).sort((x,y)=>x.d.localeCompare(y.d)),present=ss.reduce((n,x)=>n+x.c.P+x.c.R,0);
  const title=g==='all'?t('allg'):gname(gs.find(x=>x.id===g));
  let body;
  if(g==='all'){
    const G={};ss.forEach(x=>{const y=G[x.g]??={n:0,p:0,c:cnt()};y.n++;y.p+=x.c.P+x.c.R;['P','R','A'].forEach(k=>y.c[k]+=x.c[k])});
    const list=gs.filter(x=>G[x.id]).map(x=>[lang==='fr'?x.name_fr:lang==='en'?x.name_en:(x.name_ht||x.name_fr),G[x.id]]);
    RP.rows=[[t('grp'),t('sess'),t('avgp'),t('rate')]].concat(list.map(([n,y])=>[n,y.n,(y.p/y.n).toFixed(1),(pct(y.c)??'')+'%']));
    body=tb([t('grp'),t('sess'),t('avgp'),t('rate')],list.map(([n,y])=>[esc(n),y.n,(y.p/y.n).toFixed(1),pcH(pct(y.c))]));
  }else{
    const M={};
    const {data:mem}=await sb.from('memberships').select('people(id,first_name,last_name,active)').eq('group_id',g);
    (mem||[]).forEach(x=>{const p=x.people;if(p&&p.active)M[p.id]={f:p.first_name,l:p.last_name,c:cnt()}});
    rows.forEach(r=>{const p=r.people||{first_name:'?',last_name:''};const y=M[r.person_id]??={f:p.first_name,l:p.last_name,c:cnt()};y.c[r.status]++});
    const ms=Object.values(M).sort((x,y)=>(x.l+x.f).localeCompare(y.l+y.f));
    RP.rows=[[t('member'),'P','R','A',t('rate')]].concat(ms.map(y=>[y.f+' '+y.l,y.c.P,y.c.R,y.c.A,(pct(y.c)??'')+'%']));
    body=`<h2 class="sp">${t('sess')}</h2>`+tb([t('date'),'P','R','A',t('rate')],ss.map(x=>[x.d,x.c.P,x.c.R,x.c.A,pcH(pct(x.c))]))
      +`<h2 class="sp">${t('member')}</h2>`+tb([t('member'),'P','R','A',t('rate')],ms.map(y=>[esc(y.f+' '+y.l),y.c.P,y.c.R,y.c.A,pcH(pct(y.c))]));
  }
  o.innerHTML=`<div class="prt"><img src="${LOGO}" alt=""><br><strong>${esc(CHURCH)}</strong><br>${title}, ${a} / ${b}</div>
  <div class="sum"><div><b>${ss.length}</b>${t('sess')}</div><div><b>${(present/ss.length).toFixed(1)}</b>${t('avgp')}</div><div><b>${pct(tot)}%</b>${t('rate')}</div></div>
  <p class="leg">${t('rnote')} ${t('leg')}</p>`+body
  +`<div class="row noprint"><button class="btn alt" onclick="csv()">${t('csv')}</button><button class="btn alt" onclick="window.print()">${t('print')}</button></div>`;
}

async function shrink(file){const b=await createImageBitmap(file),k=Math.min(1,600/Math.max(b.width,b.height)),c=document.createElement('canvas');
  c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,'image/jpeg',.8))}
async function upPhoto(id,file,sh){

['volunteer','Seriez-vous disposé(e) à servir comme bénévole lors des activités spéciales ?','yn']]],
['Communion et croissance spirituelle',[

['mentor','Souhaitez-vous un accompagnement spirituel ou du mentorat ?','yn'],

['Communication',[

['wants_info','Souhaitez-vous recevoir :','chk',['Les annonces de l’église','Les sujets de prière','Les informations sur les événements','Les opportunités de service']]]],
['Soins pastoraux',[

['À propos de votre venue',[

['source_other','Si autre, précisez','text',null,'a_source=Autre'],
['visited','Quand avez-vous visité notre église pour la première fois ?','date'],
['affiliated_yn','Êtes-vous déjà affilié(e) (membre officiel) à notre église ?','yn'],
['affiliated','Si oui, à quelle date ?','date',null,'a_affiliated_yn=Oui'],

];
const ASPEC=[['Réservé à l’administration',[
['received','Date de réception','date'],
['status','Statut','sel',['Visiteur','Nouveau participant','Membre','Membre actif']],
['pastoral_notes','Commentaires pastoraux','area']]]];
const fld0=([k,l,ty,o],pre)=>{const n=pre+k;
  if(ty==='yn'||ty==='sel')return `<label>${l}<select name="${n}"><option value="">—</option>${(ty==='yn'?['Oui','Non']:o).map(x=>`<option>${x}</option>`).join('')}</select></label>`;
  if(ty==='chk')return `<fieldset><legend>${l}</legend>${o.map(x=>`<label class="chk"><input type="checkbox" name="${n}" value="${x}"> ${x}</label>`).join('')}</fieldset>`;
  if(ty==='area')return `<label>${l}<textarea name="${n}" rows="2"></textarea></label>`;
  return `<label>${l}<input name="${n}" type="${ty==='date'?'date':'text'}"></label>`};
const fld=(a,pre)=>a[4]?`<div data-dep="${a[4]}" style="display:none">${fld0(a,pre)}</div>`:fld0(a,pre);
const sec=(ti,body,o,id,cls)=>`<details class="sec${cls?' '+cls:''}"${o?' open':''}${id?` id="${id}"`:''}><summary>${ti}</summary><div>${body}</div></details>`;
const CONSENT='Je certifie que les renseignements sont exacts et j’autorise l’église à les conserver pour les besoins administratifs, pastoraux et de communication.';

function formHTML(c){
  const adm=!!c.adm,pub=!!c.pub;
  const hh=adm?`<label>${t('hh')}<select name="hid"><option value="new">${t('nh')}</option>${(c.H||[]).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label>
  <label id="hnw">${t('hn')}<input name="hn"></label>
  <p class="leg">Les membres d’une même famille partagent la même adresse. Choisissez une famille existante pour ajouter un conjoint ou un enfant.</p>
  <div class="row"><input name="adr" placeholder="${t('adr')}"><input name="city" placeholder="${t('city')}"></div>`:'';
  const personal=`<div class="row"><input name="first" placeholder="${t('first')}" required><input name="last" placeholder="${t('last')}" required></div>
  <label>Nom préféré (surnom)<input name="pref"></label>
  <label>Rôle dans la famille<select name="role"><option value="">—</option><option value="self">Moi-même</option><option value="husband">Époux (mari)</option><option value="wife">Épouse (femme)</option><option value="child">Enfant</option><option value="other">Autre</option></select></label>
  <label>Type de membre<select name="mtype"><option value="">—</option><option>Nouveau membre</option><option>Membre existant</option><option>Membre qui revient</option></select></label>
  <div class="row"><label>${t('dob')}<input name="dob" type="date"></label><label>Sexe<select name="sex"><option value="">—</option><option value="M">Masculin</option><option value="F">Féminin</option></select></label></div>
  <div class="adult"><label>${t('mar')}<select name="mar"><option value="">${t('none')}</option>${['single','married','separated','divorced','widowed'].map(k=>`<option value="${k}">${t(k)}</option>`).join('')}</select></label>
  <div id="sp" class="row" style="display:none"><label>Nom du conjoint / de la conjointe<input name="spouse"></label><label>Date de mariage<input name="mdate" type="date"></label></div></div>
  ${hh}
  <div class="row"><input name="phone" type="tel" placeholder="${t('phone')}"><input name="email" type="email" placeholder="${t('email')}"></div>
  <label>Profession / occupation<input name="job"></label>
  <label>${t('photo')}<input name="photo" type="file" accept="image/*"${pub?' onchange="pubPhoto(this)"':''}> <small class="mut" data-pm></small></label>`;
  const last=`<fieldset><legend>${t('sh')}</legend>${[['share_address','adr'],['share_phone','phone'],['share_email','email'],['share_birthday','bd'],['share_photo','photo']].map(([n,k])=>`<label class="chk"><input type="checkbox" name="${n}"> ${t(k)}</label>`).join('')}</fieldset>`
  +(adm?`<fieldset><legend>${t('gr')}</legend>${(c.G||[]).map(x=>`<label class="chk"><input type="checkbox" name="gr" value="${x.id}"> ${gname(x)}</label>`).join('')}</fieldset>
  <label class="chk"><input type="checkbox" name="consent"> ${CONSENT} (fiche signée reçue).</label>`:'');
  return sec('Informations personnelles',personal,1)
   +SPEC.map(([ti,fs])=>sec(ti,fs.map(a=>fld(a,'a_')).join(''),0,'','adult')).join('')
   +(adm?ASPEC.map(([ti,fs])=>sec(ti,fs.map(a=>fld(a,'b_')).join(''),0,'','adult')).join(''):'')
   +sec(adm?'Annuaire, groupes et consentement':'Annuaire',last,0,'sc');
}
function sync(f){
  const E=f.elements,kid=E.role.value==='child';
  f.querySelectorAll('.adult').forEach(d=>{d.style.display=kid?'none':''});
  const sp=f.querySelector('#sp');if(sp)sp.style.display=E.mar.value==='married'?'':'none';
  const hn=f.querySelector('#hnw');if(hn&&E.hid)hn.style.display=E.hid.value==='new'?'':'none';
  f.querySelectorAll('[data-dep]').forEach(d=>{const [n,v]=d.dataset.dep.split('=');const el=E[n],show=!kid&&!!el&&el.value===v;
    d.style.display=show?'':'none';d.querySelectorAll('input,select,textarea').forEach(x=>{x.required=show})});
}
function fill(f,o){Object.entries(o).forEach(([k,v])=>{if(v==null)return;const els=[...f.querySelectorAll(`[name="${k}"]`)];if(!els.length||els[0].type==='file')return;
  if(els[0].type==='checkbox'){if(Array.isArray(v))els.forEach(x=>{x.checked=v.includes(x.value)});else els[0].checked=!!v}
  else els[0].value=v})}
function serialize(f){const v={};
  [...f.elements].forEach(el=>{
    if(!el.name||el.type==='file'||el.type==='button'||el.type==='submit')return;
    for(let n=el;n&&n!==f;n=n.parentElement)if(n.style&&n.style.display==='none')return;
    if(el.type==='checkbox'){if(el.hasAttribute('value')){(v[el.name]??=[]);if(el.checked)v[el.name].push(el.value)}else v[el.name]=el.checked}
    else v[el.name]=el.value.trim()});
  return v}
const A=(v,pre)=>{const o={};Object.entries(v).forEach(([k,x])=>{if(k.startsWith(pre)){const y=Array.isArray(x)?(x.length?x:''):x;if(y)o[k.slice(2)]=y}});return o};
async function store(v,o){
  const pick=(x,l)=>l.includes(x)?x:null;
  const pr={household_id:o.hid,household_role:pick(v.role,['self','husband','wife','child','other']),first_name:v.first,last_name:v.last,phone:v.phone||null,email:v.email||null,
    share_address:!!v.share_address,share_phone:!!v.share_phone,share_email:!!v.share_email,share_birthday:!!v.share_birthday,share_photo:!!v.share_photo};
  if(/^pending\/[0-9a-f-]{36}\.jpg$/.test(v.photo_path||''))pr.photo_path=v.photo_path;
  let pid=o.id;
  if(pid){const {error}=await sb.from('people').update(pr).eq('id',pid);if(error)throw error}
  else{const {data,error}=await sb.from('people').insert(pr).select('id').single();if(error)throw error;pid=data.id}
  const ans=Object.assign(A(v,'a_'),o.full?A(v,'b_'):{});if(v.mtype)ans.member_type=v.mtype;
  const {error:e2}=await sb.from('people_private').upsert({person_id:pid,dob:v.dob||null,marital_status:pick(v.mar,['single','married','separated','divorced','widowed']),
    sex:pick(v.sex,['M','F']),preferred_name:v.pref||null,occupation:v.job||null,spouse_name:v.spouse||null,marriage_date:v.mdate||null,answers:ans,consent_at:today()},{onConflict:'person_id'});
  if(e2)throw e2;
  if(o.full){
    await sb.from('memberships').delete().eq('person_id',pid);
    const ids=v.gr||[];if(ids.length){const {error}=await sb.from('memberships').insert(ids.map(group_id=>({group_id,person_id:pid})));if(error)throw error}
  }
  return pid;
}

/* ---------- Admin: members list and edit form ---------- */
function shareLink(){const u=location.origin+location.pathname+'#join';
  if(navigator.share)navigator.share({title:CHURCH,text:t('sharemsg'),url:u}).catch(()=>{});
  else{if(navigator.clipboard)navigator.clipboard.writeText(u);window.open('https://wa.me/?text='+encodeURIComponent(t('sharemsg')+' '+u),'_blank')}}
async function viewPpl(){
  const m=$('#main');
  const {data:p}=await sb.from('people').select('id,first_name,last_name,phone,photo_path,active,households(name),people_private(left_status,left_date,left_location)').order('last_name');
  const P=p||[],u=await urls(P.map(x=>x.photo_path));
  const act=P.filter(x=>x.active),gone=P.filter(x=>!x.active);
  const lp=x=>{const v=x.people_private;return (Array.isArray(v)?v[0]:v)||{}};
  const LK={moved:'moved',left:'leftc',unresponsive:'unresp'};
  m.innerHTML=`<div class="row"><button class="btn" onclick="openForm(null)">${t('add')}</button><button class="btn alt" onclick="shareLink()">${t('share')}</button></div>
  <p class="leg">${t('sharenote')} ${esc(location.origin+location.pathname+'#join')}</p><h2 class="sp">${t('ppl')} (${act.length})</h2>`
  +act.map(x=>`<div id="w${x.id}"><div class="pr"><span class="mb">${av(x,u)}<span>${esc(x.first_name)} ${esc(x.last_name)}<br><small class="mut">${esc(x.households?.name||'')}${x.phone?', '+esc(x.phone):''}</small></span></span><span class="acts"><label class="btn alt sm">${t('photo')}<input type="file" accept="image/*" hidden onchange="setPhoto('${x.id}',this.files[0])"></label><button class="btn alt sm" onclick="openForm('${x.id}')">${t('edit')}</button><button class="btn alt sm" onclick="leaveForm('${x.id}')">${t('leave')}</button></span></div></div>`).join('')
  +(gone.length?`<h2 class="sp">${t('former')} (${gone.length})</h2>`+gone.map(x=>{const l=lp(x);
    const info=[l.left_status?t(LK[l.left_status]):'',l.left_date,l.left_location].filter(Boolean).map(esc).join(', ');
    return `<div class="pr"><span class="mb">${av(x,u)}<span>${esc(x.first_name)} ${esc(x.last_name)}<br><small class="mut">${info}</small></span></span><button class="btn alt sm" onclick="reactivate('${x.id}')">${t('react')}</button></div>`}).join(''):'');
}
async function openForm(id){
  const m=$('#main');
  const [h,g]=await Promise.all([sb.from('households').select('id,name').order('name'),sb.from('groups').select('id,name_fr,name_en,name_ht').eq('active',true).order('name_fr')]);
  m.innerHTML=`<p><button class="btn alt sm" onclick="viewPpl()">${t('back')}</button></p><form id="pf" data-id="${id||''}">${formHTML({adm:true,H:h.data||[],G:g.data||[]})}<button class="btn">${t('save')}</button><p class="msg" id="m3"></p></form>`;
  const f=$('#pf');
  if(id){
    const [r1,r2,r3]=await Promise.all([sb.from('people').select('*,households(address,city)').eq('id',id).single(),
      sb.from('people_private').select('*').eq('person_id',id).maybeSingle(),sb.from('memberships').select('group_id').eq('person_id',id)]);
    const p=r1.data,pv=r2.data||{},ans=pv.answers||{},hs=p.households||{};
    const o={first:p.first_name,last:p.last_name,pref:pv.preferred_name,dob:pv.dob,sex:pv.sex,mar:pv.marital_status,spouse:pv.spouse_name,mdate:pv.marriage_date,job:pv.occupation,
      phone:p.phone,email:p.email,role:p.household_role,hid:p.household_id||'new',adr:hs.address,city:hs.city,share_address:p.share_address,share_phone:p.share_phone,
      share_email:p.share_email,share_birthday:p.share_birthday,share_photo:p.share_photo,consent:!!pv.consent_at,gr:(r3.data||[]).map(x=>x.group_id),mtype:ans.member_type};
    Object.entries(ans).forEach(([k,x])=>{o['a_'+k]=x;o['b_'+k]=x});
    fill(f,o);
  }
  tx(f);f.addEventListener('change',()=>sync(f));f.onsubmit=savePerson;sync(f);
}
async function savePerson(e){
  e.preventDefault();
  const f=e.target,o=$('#m3'),v=serialize(f),id=f.dataset.id||null;
  if(!v.consent){const sc=$('#sc');if(sc)sc.open=true;o.textContent=tr('Cochez le consentement avant d’enregistrer.');return}
  try{
    let hid=v.hid;const H={address:v.adr||null,city:v.city||null};
    if(!hid||hid==='new'){const {data,error}=await sb.from('households').insert(Object.assign({name:v.hn||v.last},H)).select('id').single();if(error)throw error;hid=data.id}
    else if(H.address||H.city){const {error}=await sb.from('households').update(H).eq('id',hid);if(error)throw error}
    const pid=await store(v,{hid,id,full:true});
    const ph=f.elements.photo.files[0];if(ph)await upPhoto(pid,ph);
    viewPpl();
  }catch(err){o.textContent=t('err')+err.message}
}

/* ---------- Admin: forms sent through the public link ---------- */
async function viewSub(){
  const m=$('#main');
  const {data,error}=await sb.from('submissions').select('token,payload,status,updated_at').in('status',['pending','changed']).order('updated_at');
  if(error)return m.innerHTML=`<p>${t('err')}${esc(error.message)}</p>`;
  const L=data||[];
  m.innerHTML=`<p class="leg">${t('sharenote')} ${esc(location.origin+location.pathname+'#join')}</p><div class="row"><button class="btn alt" onclick="shareLink()">${t('share')}</button></div><h2 class="sp">${t('sub')} (${L.length})</h2>`
  +(L.length?L.map(s=>{const P=s.payload.people||[],me=P.find(x=>x.role==='self')||P[0]||{};
    return `<div class="fam"><p><strong>${esc(me.last||'')}</strong> <span class="mut">(${t(s.status==='pending'?'pending':'changed')}, ${esc(String(s.updated_at).slice(0,10))})</span></p>
    <p class="mut">${P.map(x=>esc((x.first||'')+' '+(x.last||''))).join(', ')}</p>
    <div class="acts"><button class="btn sm" onclick="approve('${s.token}')">${t('approve')}</button><button class="btn alt sm" onclick="rejectSub('${s.token}')">${t('reject')}</button></div></div>`}).join(''):`<p>${t('nosubs')}</p>`);
}
async function approve(tok){
  try{
    const {data:s,error}=await sb.from('submissions').select('*').eq('token',tok).single();if(error)throw error;
    const P=s.payload,pm=s.pmap||{},H={address:P.adr||null,city:P.city||null},L=P.people||[];
    let hid=s.household_id;
    if(hid){const {error:e1}=await sb.from('households').update(H).eq('id',hid);if(e1)throw e1}
    else{const me=L.find(x=>x.role==='self')||L[0]||{};const {data,error:e1}=await sb.from('households').insert(Object.assign({name:me.last||'—'},H)).select('id').single();if(e1)throw e1;hid=data.id}
    for(const v of L){pm[v.k]=await store(v,{hid,id:pm[v.k]||null})}
    const {error:e2}=await sb.from('submissions').update({status:'approved',household_id:hid,pmap:pm,updated_at:new Date().toISOString()}).eq('token',tok);if(e2)throw e2;
    viewSub();
  }catch(err){alert(t('err')+err.message)}
}
async function rejectSub(tok){await sb.from('submissions').update({status:'rejected'}).eq('token',tok);viewSub()}

/* ---------- Public form: no login needed ---------- */
let PUB=false,PTOK=null,pubView=()=>{};
function pubGo(){history.replaceState(null,'','#join');pubStart()}
function pubStart(){PUB=true;const h=location.hash;if(h.startsWith('#edit='))loadEdit(h.slice(6));else{PTOK=null;pubView=()=>pubForm(pubSnapshot());pubForm(null)}}
function pubShell(){$('#app').innerHTML=`<header><span class="brand"><img class="lg" src="${LOGO}" alt=""><h1>${esc(CHURCH)}</h1></span>${tools(`<button onclick="location.href=location.pathname">${t('staff')}</button>`)}</header><main id="main"></main>`}
function pubSnapshot(){if(!$('#cards'))return null;
  return {adr:$('#fadr').value,city:$('#fcity').value,consent:$('#pc').checked,
    people:[...document.querySelectorAll('.pcard')].map(c=>Object.assign(serialize(c.querySelector('form')),{k:c.dataset.k},c.dataset.photo?{photo_path:c.dataset.photo}:{}))}}
function pubForm(S){
  pubShell();
  const tk=localStorage.getItem('ftok');
  $('#main').innerHTML=`<h2>${t('pubtitle')}</h2><p class="leg">${PTOK?t('editnote'):t('pubintro')}</p>
  ${!PTOK&&tk?`<p><a href="#edit=${esc(tk)}" onclick="loadEdit('${esc(tk)}');return false">${t('myform')}</a></p>`:''}
  <div class="sec"><div><strong>${t('famaddr')}</strong><div class="row"><input id="fadr" placeholder="${t('adr')}"><input id="fcity" placeholder="${t('city')}"></div></div></div>
  <div id="cards"></div>
  <div class="row"><button type="button" class="btn alt" onclick="addCard()">${t('addm')}</button></div>
  <input id="hp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
  <label class="chk"><input type="checkbox" id="pc"> ${CONSENT}</label>
  <p class="msg" id="pm"></p><button class="btn" id="pb" onclick="pubSend()">${t('send')}</button>`;
  const d=S||{people:[{role:'self'}]};
  $('#fadr').value=d.adr||'';$('#fcity').value=d.city||'';
  (d.people&&d.people.length?d.people:[{role:'self'}]).forEach(v=>addCard(v));
  $('#pc').checked=!!d.consent;tx($('#main'));
}
function addCard(v){
  v=v||{};const n=document.querySelectorAll('.pcard').length;
  const box=document.createElement('div');box.className='pcard';box.dataset.k=v.k||Math.random().toString(36).slice(2,10);if(v.photo_path)box.dataset.photo=v.photo_path;
  box.innerHTML=`<details class="sec" open><summary>${n?t('fmem'):t('you')}</summary><div><form class="pf" onsubmit="return false">${formHTML({pub:true})}</form>${n?`<p><button type="button" class="btn alt sm" onclick="this.closest('.pcard').remove()">${t('remove')}</button></p>`:''}</div></details>`;
  $('#cards').appendChild(box);
  const f=box.querySelector('form');
  if(!n&&!v.role)v.role='self';
  fill(f,v);tx(f);f.addEventListener('change',()=>sync(f));sync(f);
  if(v.photo_path){const pm=f.querySelector('[data-pm]');if(pm)pm.textContent='✓'}
}
async function pubPhoto(el){
  const file=el.files[0],box=el.closest('.pcard'),pm=el.parentElement.querySelector('[data-pm]');if(!file)return;
  try{const blob=await shrink(file),path='pending/'+crypto.randomUUID()+'.jpg';
    const {error}=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg'});if(error)throw error;
    box.dataset.photo=path;pm.textContent='✓'}
  catch(err){pm.textContent=t('err')+err.message}
}
async function pubSend(){
  const fs=[...document.querySelectorAll('.pcard form')],o=$('#pm');
  for(const f of fs){
    f.querySelectorAll(':invalid').forEach(x=>{for(let d=x.closest('details');d;d=d.parentElement&&d.parentElement.closest('details'))d.open=true});
    if(!f.reportValidity())return;
  }
  if(!$('#pc').checked){o.textContent=tr('Cochez le consentement avant d’enregistrer.');return}
  if($('#hp').value)return;
  const snap=pubSnapshot(),p={adr:snap.adr.trim(),city:snap.city.trim(),people:snap.people};
  const b=$('#pb');b.disabled=true;
  const {data,error}=PTOK?await sb.rpc('update_form',{tok:PTOK,p}):await sb.rpc('submit_form',{p});
  b.disabled=false;
  if(error)return o.textContent=t('err')+error.message;
  const tok=PTOK||data;localStorage.setItem('ftok',tok);pubDone(tok);
}
function pubDone(tok){
  pubShell();const url=location.origin+location.pathname+'#edit='+tok;
  $('#main').innerHTML=`<h2>${t('thanks')}</h2><p>${t('keeplink')}</p><p class="mut" style="word-break:break-all">${esc(url)}</p><div class="row"><button class="btn" id="cp">${t('copy')}</button></div>`;
  $('#cp').onclick=()=>{if(navigator.clipboard)navigator.clipboard.writeText(url);$('#cp').textContent='✓'};
  pubView=()=>pubDone(tok);
}
async function loadEdit(tok){
  PUB=true;pubShell();$('#main').innerHTML='<p>…</p>';
  const {data,error}=await sb.rpc('get_form',{tok});
  if(error||!data){$('#main').innerHTML=`<p>${t('notfound')}</p>`;return}
  PTOK=tok;pubView=()=>pubForm(pubSnapshot());
  const P=data.payload;pubForm({adr:P.adr,city:P.city,people:P.people,consent:true});
}

if(/^#(join|edit=)/.test(location.hash))pubStart();else boot();
</script>
